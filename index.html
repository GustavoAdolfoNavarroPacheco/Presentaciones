<!DOCTYPE html>
<html lang="es" data-session="out">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentaciones — Campuslands Full Service</title>
  <meta name="description" content="Acceso rápido a las presentaciones, demos y archivos de Campuslands Full Service.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,900;1,900&display=swap" rel="stylesheet">

  <script>
    // La sesión se detecta antes del primer pintado para evitar parpadeos (portal.js la valida).
    (function () {
      var session = 'out';
      try {
        [localStorage, sessionStorage].forEach(function (store) {
          var raw = store.getItem('fs_session');
          if (raw && JSON.parse(raw).exp > Date.now()) session = 'in';
        });
        if (localStorage.getItem('campus_auth') === 'true') session = 'in';
      } catch (e) { /* almacenamiento bloqueado: sin sesión */ }
      document.documentElement.setAttribute('data-session', session);
    })();
  </script>
  <link rel="stylesheet" href="assets/portal/portal.css?v=11">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="sentinel" id="sentinel" aria-hidden="true"></div>

  <!-- ENCABEZADO: identidad · buscador · sesión -->
  <header class="topbar" id="topbar">
    <div class="topbar__inner">
      <a class="brand" href="./" aria-label="Presentaciones Campuslands — inicio">
        <img class="brand__logo" src="assets/logo-campuslands-color.png" alt="Campuslands">
        <h1 class="brand__name">Presentaciones</h1>
      </a>

      <div class="search" id="search" role="search" data-auth="in">
        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <label class="sr-only" for="q">Buscar presentaciones</label>
        <input id="q" class="search__input" type="search" placeholder="Buscar cliente o proyecto…" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <kbd class="search__kbd" aria-hidden="true">/</kbd>
        <button type="button" id="searchClear" class="search__clear" aria-label="Limpiar búsqueda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="topbar__actions">
        <!-- Sesión cerrada -->
        <button type="button" id="loginBtn" class="btn" data-auth="out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <span>Iniciar sesión</span>
        </button>

        <!-- Sesión iniciada -->
        <div class="user-chip" id="userChip" data-auth="in">
          <span class="user-chip__avatar" id="userInitials" aria-hidden="true"></span>
          <span class="user-chip__name" id="userName"></span>
        </div>
        <button type="button" id="logoutBtn" class="icon-btn" data-auth="in" aria-label="Cerrar sesión" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page" id="main">
    <!-- CATÁLOGO (solo con sesión iniciada) -->
    <section data-auth="in" aria-label="Catálogo de presentaciones">
      <div class="toolbar" role="group" aria-label="Filtros y orden">
        <div class="toolbar__group" id="filterSlot"></div>
        <div class="toolbar__group" id="sortSlot">
          <div class="seg" id="viewToggle" data-value="grid" role="group" aria-label="Tipo de vista">
            <span class="seg__thumb" aria-hidden="true"></span>
            <button type="button" class="seg__btn" data-view="grid" aria-pressed="true" aria-label="Vista de cuadrícula" title="Cuadrícula">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
            </button>
            <button type="button" class="seg__btn" data-view="lista" aria-pressed="false" aria-label="Vista de lista" title="Lista">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r=".8"/><circle cx="3.5" cy="12" r=".8"/><circle cx="3.5" cy="18" r=".8"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="status">
        <p class="status__count" id="count" aria-live="polite"></p>
        <ul class="chips" id="chips" aria-label="Filtros activos"></ul>
        <button type="button" class="link-btn" id="clearAll" hidden>Limpiar todo</button>
      </div>

      <!-- Skeletons: se reemplazan en cuanto portal.js construye las tarjetas -->
      <ul class="grid" id="grid" data-view="grid" aria-busy="true" aria-label="Presentaciones">
        <li class="card card--skeleton" aria-hidden="true"><div class="card__inner"><div class="skeleton skeleton--logo"></div><div class="skeleton skeleton--line" style="width:40%"></div><div class="skeleton skeleton--title"></div><div class="skeleton skeleton--line"></div><div class="skeleton skeleton--line" style="width:88%"></div><div class="skeleton skeleton--btn" style="margin-top:auto"></div></div></li>
        <li class="card card--skeleton" aria-hidden="true"><div class="card__inner"><div class="skeleton skeleton--logo"></div><div class="skeleton skeleton--line" style="width:40%"></div><div class="skeleton skeleton--title"></div><div class="skeleton skeleton--line"></div><div class="skeleton skeleton--line" style="width:88%"></div><div class="skeleton skeleton--btn" style="margin-top:auto"></div></div></li>
        <li class="card card--skeleton" aria-hidden="true"><div class="card__inner"><div class="skeleton skeleton--logo"></div><div class="skeleton skeleton--line" style="width:40%"></div><div class="skeleton skeleton--title"></div><div class="skeleton skeleton--line"></div><div class="skeleton skeleton--line" style="width:88%"></div><div class="skeleton skeleton--btn" style="margin-top:auto"></div></div></li>
      </ul>

      <div class="state" id="empty" hidden>
        <div class="state__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </div>
        <h2 class="state__title">Nada por aquí todavía</h2>
        <p class="state__text" id="emptyText"></p>
        <button type="button" class="btn btn--primary" id="emptyReset"><span class="btn__label">Limpiar filtros</span></button>
      </div>
    </section>

    <!-- Sin sesión -->
    <section class="state" id="locked" data-auth="out">
      <div class="state__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
      <h2 class="state__title">Contenido restringido</h2>
      <p class="state__text">Inicia sesión para ver y abrir las presentaciones.</p>
      <button type="button" class="btn btn--primary" id="lockedLogin"><span class="btn__label">Iniciar sesión</span></button>
    </section>
  </main>

  <!-- LOGIN (modal) -->
  <dialog class="modal" id="loginDialog" aria-labelledby="loginTitle">
    <div class="modal__panel">
      <button type="button" class="icon-btn modal__close" id="loginClose" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <h2 class="modal__title" id="loginTitle">Iniciar sesión</h2>
      <p class="modal__text">Accede para ver y abrir las presentaciones.</p>

      <form class="form" id="loginForm">
        <div class="field">
          <label class="field__label" for="loginEmail">Correo corporativo</label>
          <div class="field__control">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22 6 12 13 2 6"/></svg>
            <input class="field__input" id="loginEmail" type="email" placeholder="usuario@campuslands.com" autocomplete="username" required>
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="loginPass">Contraseña</label>
          <div class="field__control">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input class="field__input" id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="icon-btn field__action" id="togglePass" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <p class="form__hint" id="capsHint" hidden>Bloq Mayús está activado</p>
        <label class="check"><input type="checkbox" id="remember"><span>Mantener la sesión 30 días en este equipo</span></label>
        <div class="form__alert" id="loginAlert" role="alert" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="loginAlertMsg">Correo o contraseña incorrectos.</span>
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="loginSubmit"><span class="btn__label">Ingresar</span></button>
      </form>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
    <span class="toast__msg"></span>
  </div>

  <!-- El catálogo vive en assets/portal/decks.js (ver el encabezado de ese archivo para registrar un deck nuevo). -->
  <script src="assets/portal/decks.js?v=11"></script>
  <script src="assets/portal/ui.js?v=11"></script>
  <script src="assets/portal/portal.js?v=11"></script>
</body>
</html>
